{% if form.non_field_errors %}<div class="flash flash-error">{{ form.non_field_errors|join:" " }}</div>{% endif %}
{% for field in form %}
<div class="field{% if field.errors %} has-error{% endif %}">
  {% if field.label %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{% endif %}
  {{ field }}
  {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
</div>
{% endfor %}
