<li class="{% if line.checked %}done{% endif %}">
  <form method="post" action="{% url 'kondate:shopping_check' week_start|date:'Y-m-d' line.ingredient.pk %}" class="check">
    {% csrf_token %}
    <input type="hidden" name="checked" value="{% if line.checked %}0{% else %}1{% endif %}">
    <button type="submit" class="tick" role="checkbox" aria-checked="{% if line.checked %}true{% else %}false{% endif %}">
      <span class="box"></span>
      <span class="what">{{ line.ingredient.name }}{% if line.amounts %} <span class="amt">{{ line.amounts }}</span>{% endif %}</span>
      <span class="for muted small">{% for need in line.needs %}{{ need.recipe }} ({{ need.date|date:"D" }}){% if not forloop.last %}, {% endif %}{% endfor %}</span>
    </button>
  </form>
</li>
